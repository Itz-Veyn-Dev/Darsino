<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1116" id="meta-theme">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>درسینو</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1116;--s1:#161a21;--s2:#1e232c;--line:#272d38;--text:#eceef2;--mute:#8b93a3;--a:#8fc1a4;--ink:#0c1a13;--danger:#d98c92;--shadow:none;--nav:rgba(14,17,22,.92);color-scheme:dark}
[data-theme=day]{--bg:#eef0f3;--s1:#ffffff;--s2:#f3f4f7;--line:#dfe2e8;--text:#1a1d24;--mute:#6b7280;--a:#2f6f57;--ink:#ffffff;--danger:#b4545c;--shadow:0 1px 2px rgba(20,24,35,.05),0 6px 18px rgba(20,24,35,.05);--nav:rgba(255,255,255,.94);color-scheme:light}
[data-theme=ocean]{--bg:#0b141d;--s1:#121e2a;--s2:#192838;--line:#223446;--text:#e8eef4;--mute:#85a0b8;--a:#7db3d8;--ink:#071420;--nav:rgba(11,20,29,.92)}
[data-theme=amber]{--bg:#121110;--s1:#1b1a18;--s2:#24221f;--line:#302d29;--text:#efece6;--mute:#9a948a;--a:#d6a863;--ink:#1c1308;--nav:rgba(18,17,16,.92)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom));overscroll-behavior:none}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{flex:none;display:block}
.app{max-width:480px;margin:0 auto;padding:14px 16px 0}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

header{display:flex;justify-content:space-between;align-items:center;margin:2px 0 14px}
.hello small{color:var(--mute);font-size:12.5px;display:block}
.hello b{font-size:22px;font-weight:800;letter-spacing:-.2px}
.hbtns{display:flex;gap:8px}
.ib{height:40px;min-width:40px;padding:0 11px;border-radius:14px;background:var(--s1);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--mute);box-shadow:var(--shadow)}
.ib.on{color:var(--a);border-color:color-mix(in srgb,var(--a) 50%,var(--line))}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.c2{display:flex;align-items:center;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:12.5px;color:var(--mute);white-space:nowrap;box-shadow:var(--shadow)}
.c2 b{color:var(--text);font-weight:700}
.c2 svg{color:var(--a)}

.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{color:var(--mute);font-weight:400;font-size:12px}
.lnk{background:none;border:0;color:var(--a);font-size:12.5px;padding:0}
.pbar{height:6px;background:var(--s2);border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--a);border-radius:6px;transition:width .6s}

.phases{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:10px;box-shadow:var(--shadow)}
.phases button{flex:1;border:0;background:none;color:var(--mute);font-size:12.5px;padding:9px 2px;border-radius:10px;white-space:nowrap}
.phases button.on{background:var(--s2);color:var(--text);font-weight:700}
.presets{display:flex;gap:7px;justify-content:center;margin-bottom:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.presets:empty{display:none}
.presets::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--s1);color:var(--text);font-size:13px;padding:7px 13px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip.on{border-color:var(--a);color:var(--a);background:color-mix(in srgb,var(--a) 10%,var(--s1))}
.chip.add{border-style:dashed;color:var(--mute)}
.presets .chip{padding:6px 12px;font-size:12.5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

.ring-wrap{position:relative;width:min(74vw,274px);height:min(74vw,274px);margin:4px auto 0}
.ring-wrap::before{content:"";position:absolute;inset:18px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--a) 9%,transparent),transparent)}
.ring-wrap svg.r{position:relative;width:100%;height:100%;transform:rotate(-90deg)}
.track{stroke:var(--s2);fill:none}
.arc{fill:none;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.arc.out{stroke:var(--mute);opacity:.5}
.arc.in{stroke:var(--a)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#plant{width:100px;height:92px;margin:-6px 0 -8px}
#plant svg,.pl svg{width:100%;height:100%;overflow:visible}
#plant.pop{animation:pop .6s ease}
@keyframes pop{40%{transform:scale(1.16)}}
.tree{overflow:visible}
.tree.sw .swg{animation:sway 3.6s ease-in-out infinite;transform-origin:50px 84px}
.tree.ps .swg{filter:saturate(.6) brightness(.9)}
@keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.4deg)}}
.tw{animation:tw 1.7s ease-in-out infinite}
@keyframes tw{50%{opacity:.3}}
.center .t{font-size:42px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums;direction:ltr;line-height:1.15}
.center .l{color:var(--mute);font-size:12.5px;margin-top:1px}
.center .g{margin-top:6px;font-size:11px;color:var(--mute);background:var(--s2);padding:3px 10px;border-radius:999px}
.dots{display:flex;gap:8px;justify-content:center;margin:6px 0 10px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--s2);border:1px solid var(--line)}
.dots i.f{background:var(--a);border-color:var(--a)}
.subjects{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.subjects::-webkit-scrollbar{display:none}

.ctrl{display:flex;justify-content:center;align-items:flex-start;gap:26px;margin:0 0 18px}
.cb{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--mute);font-size:11.5px;width:64px}
.cb .ic{width:52px;height:52px;border-radius:50%;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;color:var(--text);box-shadow:var(--shadow)}
.cb.hide{visibility:hidden}
.cb.main{width:84px;color:var(--text)}
.cb.main .ic{width:74px;height:74px;background:var(--a);border:0;color:var(--ink);box-shadow:0 10px 26px color-mix(in srgb,var(--a) 28%,transparent)}
.cb:active .ic{transform:scale(.94)}

.today .th{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.today .th b{font-size:14.5px}.today .th span{font-size:13px;color:var(--mute)}
.tmeta{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--mute)}
.tmeta b{color:var(--text);font-weight:700}
.week{display:flex;justify-content:space-between}
.wd{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:var(--mute)}
.wd .c{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--text)}
.wd.d .c{background:color-mix(in srgb,var(--a) 16%,transparent);border-color:color-mix(in srgb,var(--a) 55%,var(--line))}
.wd.g .c{background:var(--a);border-color:var(--a);color:var(--ink)}
.wd.t{color:var(--text);font-weight:700}
.quote{text-align:center;color:var(--mute);font-size:12.5px;padding:2px 20px 10px;line-height:1.9}
.empty{color:var(--mute);text-align:center;padding:24px 10px;font-size:13.5px;line-height:2}
.empty.sm{padding:10px}

.task{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.task:last-child{border:0}
.task .tt{flex:1;min-width:0}
.task .tt b{display:block;font-weight:500;overflow-wrap:anywhere}
.task .tt small{color:var(--mute);font-size:11.5px;display:flex;align-items:center;gap:6px;margin-top:2px}
.task.d .tt b{color:var(--mute);text-decoration:line-through}
.ck{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);background:var(--s2);display:grid;place-items:center;color:var(--ink);padding:0;flex:none}
.task.d .ck{background:var(--a);border-color:var(--a)}
.x{background:none;border:0;color:var(--mute);padding:5px;display:grid;place-items:center}
.x.go{color:var(--a)}

.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:var(--shadow)}
.seg button{flex:1;border:0;background:none;color:var(--mute);font-size:13px;padding:8px 4px;border-radius:10px;white-space:nowrap}
.seg button.on{background:var(--s2);color:var(--text);font-weight:700}
.seg.mini{margin-bottom:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--shadow);min-width:0}
.kpi span{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.kpi b{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:800;margin-top:4px}
.kpi.big{grid-column:span 2;background:color-mix(in srgb,var(--a) 9%,var(--s1))}
.kpi.big b{font-size:30px}
.delta{display:inline-flex;align-items:center;gap:5px;font-style:normal;font-size:12px;margin-top:6px;color:var(--mute)}
.delta.up{color:var(--a)}
.lvl{display:flex;align-items:center;gap:12px}
.lvl .badge{width:42px;height:42px;border-radius:14px;background:color-mix(in srgb,var(--a) 14%,var(--s1));color:var(--a);font-weight:800;display:grid;place-items:center;flex:none;border:1px solid color-mix(in srgb,var(--a) 30%,var(--line))}
.lvl .info{flex:1;min-width:0}
.lvl .r1{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px}
.lvl .r1 span{color:var(--mute)}
.plot{position:relative;height:120px;display:flex;align-items:flex-end;gap:var(--gap,6px);border-bottom:1px solid var(--line)}
.plot .col{flex:1;display:flex;align-items:flex-end;height:100%}
.plot i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:color-mix(in srgb,var(--a) 38%,var(--s2));min-height:3px}
.plot .col.today i{background:var(--a)}
.goal-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--mute);opacity:.6}
.xl{display:flex;gap:var(--gap,6px);margin-top:6px}
.xl span{flex:1;text-align:center;font-size:10.5px;color:var(--mute);white-space:nowrap}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;direction:ltr}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--s2);display:block}
.heat i.e{background:transparent}
.heat i.l1{background:color-mix(in srgb,var(--a) 25%,var(--s2))}
.heat i.l2{background:color-mix(in srgb,var(--a) 50%,var(--s2))}
.heat i.l3{background:color-mix(in srgb,var(--a) 75%,var(--s2))}
.heat i.l4{background:var(--a)}
.heat i.now{outline:1.5px solid var(--text);outline-offset:1px}
.hbar{margin-bottom:12px}.hbar:last-child{margin-bottom:0}
.hbar .h{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px}
.hbar .h b{font-weight:500;display:flex;align-items:center;gap:7px}
.hbar .h span{color:var(--mute);font-size:12.5px}
.hbar .b{height:7px;background:var(--s2);border-radius:7px;overflow:hidden}
.hbar .b i{display:block;height:100%;border-radius:7px}

/* garden */
.garden{display:flex;flex-wrap:wrap;align-items:flex-end;min-height:64px;border-bottom:3px solid color-mix(in srgb,var(--mute) 40%,var(--s2));gap:2px 0}
.gt{width:44px;height:50px;border:0;background:none;padding:0;border-radius:12px;display:grid;place-items:end center;cursor:pointer;transition:transform .2s,background .2s}
.gt svg{width:44px;height:44px;overflow:visible;pointer-events:none}
.gt:active{transform:scale(.94)}
.gt.sel{background:color-mix(in srgb,var(--a) 14%,transparent)}
.tinfo{display:none;margin-bottom:12px;background:var(--s2);border:1px solid var(--line);border-radius:18px;padding:14px;animation:fade .25s ease}
.tinfo.on{display:block}
.tinfo .top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tinfo .pl{width:64px;height:64px;flex:none}
.tinfo .top b{display:block;font-size:15px}
.tinfo .top small{color:var(--mute);font-size:12px}
.tinfo .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tinfo .grid div{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0}
.tinfo .grid small{display:block;color:var(--mute);font-size:11px;margin-bottom:3px}
.tinfo .grid b{font-size:13px;display:flex;align-items:center;gap:6px;overflow-wrap:anywhere}
.tinfo .nt{margin-top:8px;font-size:12.5px;color:var(--mute);line-height:1.8}
.tinfo .cl{position:absolute;left:10px;top:10px}
.hint{font-size:11.5px;color:var(--mute);text-align:center;margin-top:10px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:13px 6px;text-align:center;color:var(--mute);opacity:.55}
.bdg .ico{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;margin:0 auto 7px;background:var(--s1)}
.bdg b{display:block;font-size:12px;font-weight:700}
.bdg small{display:block;font-size:10.5px;opacity:.8;margin-top:2px;line-height:1.5}
.bdg.on{opacity:1;color:var(--text);border-color:color-mix(in srgb,var(--a) 45%,var(--line))}
.bdg.on .ico{background:color-mix(in srgb,var(--a) 16%,var(--s1));color:var(--a)}

/* history */
.fbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.dayh{display:flex;justify-content:space-between;color:var(--mute);font-size:12.5px;margin:6px 4px 8px}
.dayh b{color:var(--text)}
.log{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.log .n{flex:1;min-width:0}
.log .n b{display:block;font-size:14px}
.log .n small{color:var(--mute);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .d{font-weight:700;font-size:14px;direction:ltr}
.log .m{color:var(--a)}
.fab{position:fixed;bottom:calc(82px + env(safe-area-inset-bottom));left:18px;background:var(--a);color:var(--ink);border:0;border-radius:16px;padding:12px 18px;font-weight:700;box-shadow:0 10px 26px rgba(0,0,0,.28);z-index:9;display:none;align-items:center;gap:7px}
.fab.on{display:flex}

/* plan items */
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .tt{flex:1;min-width:0}
.item .tt b{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.item .tt small{display:block;color:var(--mute);font-size:12px;margin-top:3px;line-height:1.7}
.pct{font-weight:800;font-size:15px;color:var(--a)}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:12px}
.metric{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.metric small{color:var(--mute);font-size:11.5px;display:block}
.metric b{font-size:19px;display:block;margin-top:3px}
.pill{font-size:11.5px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--a) 14%,var(--s2));color:var(--a);white-space:nowrap}
.pill.mute{background:var(--s2);color:var(--mute)}
.exam .rw{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.exam .rw b{font-size:15px}
.exam .rw small{color:var(--mute);font-size:12px;display:block;margin-top:2px}
.exam p{color:var(--mute);font-size:12.5px;margin:10px 0 0;line-height:1.8}
.p{color:var(--mute);font-size:13px;line-height:1.9;margin:10px 0 0}
.p b{color:var(--text)}
.mini-bars{display:flex;align-items:flex-end;gap:6px;height:92px;margin-top:8px}
.mini-bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;font-size:10px;color:var(--mute)}
.mini-bars i{display:block;width:70%;max-width:26px;border-radius:7px 7px 3px 3px;background:color-mix(in srgb,var(--a) 40%,var(--s2))}
.mini-bars div.t i{background:var(--a)}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
.set-row:last-child{border:0}
.set-row small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--s2);font-size:18px;line-height:1;display:grid;place-items:center}
.step b{min-width:50px;text-align:center;font-size:14px}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{display:none}
.sw span{position:absolute;inset:0;background:var(--s2);border:1px solid var(--line);border-radius:20px;transition:.2s}
.sw span::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--mute);transition:.2s}
.sw input:checked+span{background:color-mix(in srgb,var(--a) 28%,var(--s2));border-color:var(--a)}
.sw input:checked+span::after{transform:translateX(-20px);background:var(--a)}
.themes{display:flex;gap:12px}
.themes button{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mute)}
.themes i{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);display:block}
.themes button.on i{border-color:var(--a)}
.themes button.on{color:var(--text)}
input.tx,select.tx,textarea.tx{width:100%;background:var(--s2);border:1px solid var(--line);color:var(--text);font:inherit;border-radius:12px;padding:12px;font-size:15px;margin-bottom:10px;outline:none}
input.tx:focus,textarea.tx:focus,select.tx:focus{border-color:var(--a)}
textarea.tx{resize:none;height:76px}
input[type=date].tx,input[type=time].tx{direction:ltr;text-align:right}
label.lb{font-size:12.5px;color:var(--mute);display:block;margin:0 2px 5px}
.btn{border:0;font-weight:700;border-radius:14px;padding:14px 20px;font-size:15px;color:var(--ink);background:var(--a);width:100%;display:flex;align-items:center;justify-content:center;gap:7px}
.btn.ghost{background:var(--s2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--s2);color:var(--danger);border:1px solid var(--line)}
.btn.sm{width:auto;padding:0 16px;font-size:14px}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.sub-row{display:flex;gap:8px;margin-top:10px}.sub-row input{margin:0}
.tag{display:flex;align-items:center;gap:10px;padding:8px 0}
.tag b{flex:1;font-weight:500;font-size:14px}
.tag .x{color:var(--danger)}
.chk{display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:10px;font-size:13.5px}
.chk input{width:18px;height:18px;accent-color:var(--a)}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{background:none;border:0;color:var(--mute);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:14px;flex:1;max-width:96px}
nav button.on{color:var(--a)}
nav button.on svg{stroke-width:2.2}

#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.on{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(4,6,12,.55);animation:fadein .2s}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .3s cubic-bezier(.2,.9,.3,1)}
#sheet .grab{width:42px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px}
#sheet h2{margin:0 0 4px;font-size:19px;text-align:center}
#sheet p.s{margin:0 0 16px;color:var(--mute);text-align:center;font-size:13px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.moods{display:flex;justify-content:space-between;margin:4px 0 14px;gap:6px}
.moods button{flex:1;background:var(--s2);border:1.5px solid transparent;border-radius:14px;height:50px;display:grid;place-items:center;color:var(--mute)}
.moods button.on{border-color:var(--a);color:var(--a);background:color-mix(in srgb,var(--a) 10%,var(--s2))}
.bigplant{width:130px;height:130px;margin:0 auto 2px}
.bigplant svg{width:100%;height:100%;overflow:visible}

#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--text);color:var(--bg);font-weight:600;padding:11px 16px;border-radius:14px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:tin .3s;pointer-events:auto;display:flex;gap:10px;align-items:center;max-width:92vw}
.toast button{background:none;border:0;color:inherit;font-weight:800;padding:0;text-decoration:underline}
@keyframes tin{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.cf{position:fixed;top:-12px;width:8px;height:12px;z-index:70;border-radius:2px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}

/* focus room */
#room{position:fixed;inset:0;z-index:35;display:none;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:calc(18px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));background:radial-gradient(120% 80% at 50% 30%,color-mix(in srgb,var(--a) 13%,var(--bg)) 0%,var(--bg) 64%);text-align:center}
#room.on{display:flex;animation:fadein .35s}
.rtop{position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;transition:opacity .6s}
.rsub{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:7px;justify-content:center;min-height:20px}
#r-subj{font-size:19px;font-weight:800;margin:4px 0 2px}
.rstage{position:relative;width:min(76vw,290px);height:min(76vw,290px);margin:14px 0 6px}
.rstage svg.rr{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#r-plant{position:absolute;inset:16% 16% 12%}
#r-plant svg{width:100%;height:100%;overflow:visible}
.breath{position:absolute;inset:18%;border-radius:50%;background:color-mix(in srgb,var(--a) 16%,transparent);border:1.5px solid color-mix(in srgb,var(--a) 50%,transparent);display:none;align-items:center;justify-content:center;font-size:15px;color:var(--a);animation:breath 8s ease-in-out infinite}
#room.brk .breath{display:flex}
#room.brk #r-plant{display:none}
@keyframes breath{0%,100%{transform:scale(.72)}50%{transform:scale(1.04)}}
#r-clock{font-size:clamp(54px,17vw,78px);font-weight:800;direction:ltr;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1.1}
#r-stage{font-size:13px;color:var(--mute);margin-top:4px;min-height:20px}
.rtasks{display:flex;gap:8px;overflow-x:auto;max-width:100%;margin-top:14px;padding:2px;scrollbar-width:none;transition:opacity .6s}
.rtasks::-webkit-scrollbar{display:none}
.rctl{display:flex;gap:26px;align-items:center;margin-top:18px;transition:opacity .6s}
#room .cb{width:60px}
#room.quiet .rtop,#room.quiet .rtasks,#room.quiet .rctl{opacity:0;pointer-events:none}
@media (max-height:640px){.rstage{width:min(60vw,220px);height:min(60vw,220px);margin:6px 0}.rctl{margin-top:8px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== v5 design system additions ===== */
:root{--font:Vazirmatn,Tahoma,system-ui,sans-serif;--warn:#d6a863}
html,body{font-family:var(--font)}
[data-theme=forest]{--bg:#0d1410;--s1:#141d17;--s2:#1b271f;--line:#26362b;--text:#e9efe9;--mute:#8aa392;--a:#9cc58a;--ink:#0e1a0b;--nav:rgba(13,20,16,.92)}
[data-theme=sunset]{--bg:#17111a;--s1:#1f1823;--s2:#281f2d;--line:#382c3f;--text:#f0e9f1;--mute:#a592ab;--a:#d79aa0;--ink:#2a1014;--nav:rgba(23,17,26,.92)}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.ph{display:flex;justify-content:space-between;align-items:center;margin:2px 0 14px;min-height:44px}
.sec{margin:20px 4px 10px;font-size:12.5px;color:var(--mute);font-weight:700;letter-spacing:.2px;display:flex;justify-content:space-between;align-items:center}
.sec button{font-size:12.5px}
.muted{color:var(--mute)}
.sm{font-size:12.5px}
.right{margin-inline-start:auto}
.grow{flex:1;min-width:0}
.hr{height:1px;background:var(--line);margin:12px 0}
.ferr{color:var(--danger);font-size:12px;margin:-4px 2px 10px;display:none}
.ferr.on{display:block}
.card.tint{background:color-mix(in srgb,var(--a) 8%,var(--s1));border-color:color-mix(in srgb,var(--a) 28%,var(--line))}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 14px}
.empty .eic{width:52px;height:52px;border-radius:18px;background:var(--s2);color:var(--a);display:grid;place-items:center}
.empty b{color:var(--text);font-size:14.5px}
.empty p{margin:0;color:var(--mute);font-size:13px;line-height:1.9}
.empty .btn{width:auto;margin-top:6px;padding:11px 20px;font-size:14px}
nav button{font-size:10.5px;gap:3px}
nav button .nb{position:relative;display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:background .2s}
nav button.on .nb{background:color-mix(in srgb,var(--a) 16%,transparent)}
nav .dotb{position:absolute;top:2px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--a);border:2px solid var(--bg);display:none}
nav .dotb.on{display:block}
.seg button{font-size:12.5px}
.seg.scroll{overflow-x:auto;scrollbar-width:none}
.seg.scroll::-webkit-scrollbar{display:none}
.btn.line{background:transparent;border:1.5px solid var(--a);color:var(--a)}
.btn.small{padding:10px 16px;font-size:13.5px;width:auto;border-radius:12px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--s2);display:grid;place-items:center;color:var(--mute);padding:0;flex:none}
.icon-btn.danger{color:var(--danger)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,var(--s2));color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--danger) 16%,var(--s2));color:var(--danger)}

/* coach */
.coach{display:flex;gap:12px;align-items:flex-start}
.coach .cic{width:42px;height:42px;border-radius:14px;background:color-mix(in srgb,var(--a) 18%,var(--s1));color:var(--a);display:grid;place-items:center;flex:none}
.coach h4{margin:0 0 4px;font-size:12px;color:var(--a);font-weight:700}
.coach .main{font-size:15.5px;font-weight:700;line-height:1.7;margin:0}
.why{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.why span{font-size:11.5px;color:var(--mute);background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.coach .acts{display:flex;gap:8px}
.coach .acts .btn{padding:11px 16px;font-size:14px}

/* day strip + blocks */
.dstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.dstrip button{border:1px solid var(--line);background:var(--s1);border-radius:14px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute);position:relative}
.dstrip button b{font-size:15px;color:var(--text);font-weight:700}
.dstrip button.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 10%,var(--s1))}
.dstrip button.today small{color:var(--a)}
.dstrip button .dd{width:5px;height:5px;border-radius:50%;background:var(--line)}
.dstrip button.has .dd{background:var(--mute)}
.dstrip button.full .dd{background:var(--a)}
.dstrip button.off{opacity:.55}
.blk{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.blk:last-child{border:0}
.blk .tm{width:46px;flex:none;text-align:center;font-size:12px;color:var(--mute);padding-top:2px;direction:ltr}
.blk .tm b{display:block;color:var(--text);font-size:13px}
.blk .bd2{flex:1;min-width:0}
.blk .bd2 b{display:flex;align-items:center;gap:7px;font-size:14px}
.blk .bd2 small{display:block;color:var(--mute);font-size:12px;margin-top:3px;line-height:1.7}
.blk.done .bd2 b{color:var(--mute);text-decoration:line-through}
.blk .ba{display:flex;gap:6px;flex:none}
.bar-pl{display:flex;height:8px;border-radius:8px;overflow:hidden;background:var(--s2);margin:10px 0 8px}
.bar-pl i{display:block;height:100%}

/* flashcards */
#review{position:fixed;inset:0;z-index:38;display:none;flex-direction:column;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
#review.on{display:flex;animation:fadein .25s}
.rv-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.rv-top .pbar{flex:1}
.rv-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);margin-bottom:12px}
.fc{perspective:1100px;flex:1;min-height:260px;max-height:440px;margin-bottom:16px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.fc.on .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;border:1px solid var(--line);background:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;box-shadow:var(--shadow)}
.fc-b{transform:rotateY(180deg);background:color-mix(in srgb,var(--a) 8%,var(--s1))}
.fc-f small,.fc-b small{color:var(--mute);font-size:12px;margin-bottom:12px}
.fc-t{font-size:21px;font-weight:700;line-height:1.9;overflow-wrap:anywhere;max-height:100%;overflow:auto}
.fc-hint{position:absolute;bottom:14px;font-size:11.5px;color:var(--mute)}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rates button{border:1px solid var(--line);background:var(--s1);border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:700}
.rates button small{color:var(--mute);font-size:11px;font-weight:400}
.rates button.r0{color:var(--danger)}.rates button.r3{color:var(--a)}
.deck{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.deck:last-child{border:0}
.deck .tt{flex:1;min-width:0}.deck .tt b{display:flex;gap:7px;align-items:center;font-size:14px}.deck .tt small{color:var(--mute);font-size:12px}
.bigstat{display:flex;align-items:baseline;gap:8px}
.bigstat b{font-size:38px;font-weight:800;line-height:1}
.bigstat span{color:var(--mute);font-size:13px}
.cardrow{padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.cardrow:last-child{border:0}
.cardrow .tt{flex:1;min-width:0}.cardrow b{display:block;font-size:13.5px;font-weight:600;overflow-wrap:anywhere}.cardrow small{display:block;color:var(--mute);font-size:12px;margin-top:3px;overflow-wrap:anywhere}

/* charts */
.lc{width:100%;height:auto;display:block;direction:ltr}
.lc .gl{stroke:var(--line);stroke-width:1}
.lc .axt{fill:var(--mute);font-size:9px;font-family:var(--font)}
.lc .ln{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lc .pt{stroke:var(--s1);stroke-width:1.5}
.lc .tg{stroke:var(--warn);stroke-width:1;stroke-dasharray:4 4;opacity:.7}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--mute)}
.lg span{display:flex;align-items:center;gap:6px}
.subc{padding:14px 0;border-bottom:1px solid var(--line)}
.subc:last-child{border:0;padding-bottom:0}
.subc .h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.subc .h b{display:flex;align-items:center;gap:8px;font-size:14.5px}
.subc .m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.subc .m div{background:var(--s2);border-radius:12px;padding:8px 10px}
.subc .m small{display:block;color:var(--mute);font-size:11px}
.subc .m b{font-size:14.5px}
.subc p{margin:0;color:var(--mute);font-size:12.5px;line-height:1.9}
.tr{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.tr.up{color:var(--a)}.tr.dn{color:var(--danger)}

/* missions */
.mi{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.mi:last-child{border:0;padding-bottom:0}
.mi .mic{width:40px;height:40px;border-radius:13px;background:var(--s2);color:var(--mute);display:grid;place-items:center;flex:none}
.mi.done .mic{background:color-mix(in srgb,var(--a) 18%,var(--s1));color:var(--a)}
.mi .mb{flex:1;min-width:0}
.mi .mb b{display:block;font-size:14px}
.mi .mb small{display:block;color:var(--mute);font-size:12px;margin:2px 0 8px;line-height:1.7}
.mi .mf{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--mute);gap:8px}
.mi.claimed{opacity:.55}
.xpv{color:var(--a);font-weight:700}
.sumbar{display:flex;gap:14px;align-items:center}
.ring-s{width:62px;height:62px;position:relative;flex:none}
.ring-s svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-s b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px}

/* settings */
.thgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.thm{border:2px solid var(--line);border-radius:16px;padding:8px;background:var(--s1);display:flex;flex-direction:column;gap:7px;align-items:stretch;font-size:12px;color:var(--mute)}
.thm.on{border-color:var(--a);color:var(--text)}
.thm .pv{height:44px;border-radius:10px;display:flex;align-items:flex-end;gap:4px;padding:6px}
.thm .pv i{display:block;border-radius:4px;height:100%}
.fontl{display:flex;flex-direction:column;gap:8px}
.fopt{border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;background:var(--s1);text-align:right;width:100%}
.fopt.on{border-color:var(--a)}
.fopt span{font-size:12px;color:var(--mute)}
.fopt b{font-size:16px;font-weight:600}
.ssec{display:flex;align-items:center;gap:8px;margin:22px 4px 10px;font-size:12.5px;color:var(--mute);font-weight:700}
.rpt{width:100%;border-radius:16px;border:1px solid var(--line);display:block;margin-bottom:12px}
.tour-dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.tour-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.tour-dots i.on{background:var(--a);width:20px;border-radius:7px}
.tour-ic{width:72px;height:72px;border-radius:24px;background:color-mix(in srgb,var(--a) 14%,var(--s2));color:var(--a);display:grid;place-items:center;margin:6px auto 14px}
.legend-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.legend-g div{display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:12px;padding:6px 10px;font-size:12px}
.legend-g svg{width:30px;height:30px;overflow:visible;flex:none}
.legend-g small{display:block;color:var(--mute);font-size:10.5px}
.gt.rare svg{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--a) 70%,transparent))}
/* room scenes */
#room::before,#room::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s}
#room.sc-night::before{opacity:.9;background-image:radial-gradient(2px 2px at 12% 22%,var(--a),transparent),radial-gradient(2px 2px at 78% 14%,var(--a),transparent),radial-gradient(1.5px 1.5px at 40% 64%,var(--a),transparent),radial-gradient(2px 2px at 88% 70%,var(--a),transparent),radial-gradient(1.5px 1.5px at 22% 82%,var(--a),transparent);animation:ffly 7s ease-in-out infinite alternate}
@keyframes ffly{from{transform:translateY(0);opacity:.35}to{transform:translateY(-18px);opacity:.95}}
#room.sc-rain::before{opacity:.5;background:repeating-linear-gradient(105deg,transparent 0 22px,color-mix(in srgb,var(--text) 14%,transparent) 22px 23px);animation:rainf .9s linear infinite}
@keyframes rainf{to{background-position:-40px 160px}}
.rtop{gap:8px}
.rtop .grp{display:flex;gap:8px}
#r-plant{inset:14% 14% 10%}
.rstat{display:flex;gap:18px;justify-content:center;margin-top:10px;font-size:12px;color:var(--mute);transition:opacity .6s}
#room.quiet .rstat{opacity:.0}
@media (max-height:700px){.rstat{display:none}}
.lnk{white-space:nowrap}
.presets{gap:6px}
.presets .chip{padding:6px 10px;font-size:12px;gap:4px}
.blk{flex-wrap:wrap}
.blk .ba{flex-basis:100%;justify-content:flex-start;padding-inline-start:58px;margin-top:2px}
.blk .ba .icon-btn{width:34px;height:34px;border-radius:11px}
</style>

<body>
<div id="toasts"></div>
<div class="app" id="app" data-phase="focus">

  <!-- امروز -->
  <section class="view on" id="v-home">
    <header class="ph">

      </div>

    <div class="chips" id="chips"></div>

      <button data-p="long">استراحت بلند</button>

    </div>
    <div class="presets" id="presets"></div>
    <div class="ring-wrap">
      <svg class="r" viewBox="0 0 300 300">
        <circle class="track" cx="150" cy="150" r="141" stroke-width="5"/>
        <circle class="arc out" id="arc-out" cx="150" cy="150" r="141" stroke-width="5"/>
        <circle class="track" cx="150" cy="150" r="122" stroke-width="11"/>
        <circle class="arc in" id="arc-in" cx="150" cy="150" r="122" stroke-width="11"/>
      </svg>
      <div class="center">
        <div id="plant"></div>
        <div class="t" id="clock">25:00</div>
        <div class="l" id="clock-l"></div>
        <div class="g" id="goal-l"></div>
      </div>
    </div>
    <div class="dots" id="dots"></div>

const weekStart=()=>{const d=new Date(),n=(d.getDay()+1)%7;d.setDate(d.getDate()-n);d.setHours(0,0,0,0);return d};
const isoDay=d=>{const x=new Date(d);return `${x.getFullYear()}-${pad2(x.getMonth()+1)}-${pad2(x.getDate())}`};
const weekKey=()=>isoDay(weekStart());
const todayIdx=()=>(new Date().getDay()+1)%7;
const dateOfDay=i=>{const d=weekStart();d.setDate(d.getDate()+i);return d};
const faDay=i=>new Intl.DateTimeFormat('fa-IR',{day:'numeric'}).format(dateOfDay(i));
const faDate=(d)=>new Intl.DateTimeFormat('fa-IR',{day:'numeric',month:'long'}).format(d);
const daysUntil=ds=>Math.ceil((new Date(ds+'T00:00:00')-new Date(todayKey()+'T00:00:00'))/864e5);
function seedRand(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return()=>{h+=0x6D2B79F5;let t=Math.imul(h^h>>>15,1|h);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296}}
function seededPick(arr,n,seed){const r=seedRand(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}

/* ---------- plant svg (continuous growth) ---------- */
const ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
function plant(p,color,o={}){
  p=Math.max(0,Math.min(1,+p||0));const c=color||'var(--a)',by=84,wilt=!!o.wilt;
  const mid=wilt?'#8a7348':c,dk=wilt?'#6b5a3a':`color-mix(in srgb,${c} 62%,#06240f)`,lt=wilt?'#a89060':`color-mix(in srgb,${c} 70%,#ffffff)`;
  const wrap=b=>`<svg viewBox="0 0 100 100" class="tree${o.sway?' sw':''}${o.paused?' ps':''}">${b}</svg>`;
  let s='';
  if(o.sun!==false){const sy=(70-ease(p)*44).toFixed(1);s+=`<circle cx="83" cy="${sy}" r="12" style="fill:var(--a)" opacity=".14"/><circle cx="83" cy="${sy}" r="6" style="fill:var(--a)" opacity=".7"/>`}
  s+=`<ellipse cx="50" cy="92" rx="32" ry="5" fill="rgba(128,128,128,.14)"/><path d="M24 91Q50 76 76 91Z" fill="#5a4636"/><path d="M24 91Q50 76 76 91" fill="none" stroke="#7a604a" stroke-width="1"/>`;
  if(p<.06)return wrap(s+`<ellipse cx="50" cy="83" rx="3.8" ry="2.7" fill="#c79a62"/><path d="M48.500 82.200q1.500-1 3 0" stroke="#8a6a3c" stroke-width=".8" fill="none"/>`);
  const t=ease((p-.05)/.95),H=3+t*50,top=by-H,w=1.5+t*3.4,lean=2.5*(1-t*.5);
  let g=`<path d="M50 ${by}Q${50+lean} ${by-H*.5} 50 ${top}" fill="none" stroke="${wilt?'#7a6445':'#a08060'}" stroke-width="${w.toFixed(2)}" stroke-linecap="round"/>`;
  for(let i=0;i<6;i++){const k=ease((p-(.08+i*.075))/.14);if(k<=0)continue;const side=i%2?1:-1,y=by-H*(.22+i*.12),L=(i<3?7.5:5)*k,cx=50+side*L*.85;
    g+=`<ellipse cx="${cx.toFixed(1)}" cy="${y.toFixed(1)}" rx="${L.toFixed(1)}" ry="${(L*.48).toFixed(1)}" transform="rotate(${wilt?side*55:side*-26} ${cx.toFixed(1)} ${y.toFixed(1)})" fill="${i%2?mid:lt}"/>`}
  const ck=ease((p-.42)/.58);
  if(ck>0){const R=(3+ck*19)*(wilt?.75:1),cy=top+R*.05;
    g+=`<circle cx="${(50-R*.82).toFixed(1)}" cy="${(cy+R*.62).toFixed(1)}" r="${(R*.7).toFixed(1)}" fill="${dk}"/><circle cx="${(50+R*.82).toFixed(1)}" cy="${(cy+R*.62).toFixed(1)}" r="${(R*.7).toFixed(1)}" fill="${dk}"/><circle cx="50" cy="${cy.toFixed(1)}" r="${R.toFixed(1)}" fill="${mid}"/><circle cx="${(50-R*.3).toFixed(1)}" cy="${(cy-R*.35).toFixed(1)}" r="${(R*.55).toFixed(1)}" fill="${lt}" opacity=".7"/>`;
    if((o.bloom||o.fruit)&&p>=.97){let f='';[[-.5,-.55],[.45,-.4],[0,.05],[-.75,.5],[.8,.5],[.2,-.85],[-.2,.7]].forEach((q,i)=>{f+=`<circle cx="${(50+q[0]*R).toFixed(1)}" cy="${(cy+q[1]*R).toFixed(1)}" r="${o.fruit?2.9:2.1}" fill="${o.fruit?(i%2?'#d9a35b':'#c9794f'):(i%2?'#e9d9a0':'#e8bcc6')}"/>`});
      g+=`<g class="tw">${f}</g>`;
      s+=`<g class="tw" style="stroke:var(--a)" stroke-width="1.2" stroke-linecap="round"><path d="M16 24v7M12.500 27.500h7"/><path d="M86 8v6M83 11h6"/><path d="M10 60v5M7.500 62.500h5"/></g>`}
  }
  const dl=o.sway?` style="animation-delay:-${((Date.now()/1000)%3.6).toFixed(2)}s"`:'';
  return wrap(s+`<g class="swg"${dl}>${g}</g>`);
}

function agg(){
  const byDay={},bySub={},parts=[0,0,0,0];let total=0,maxSes=0,early=false,owl=false,trees=0,moodS=0,moodN=0;
  for(const l of S.logs){const d=dayIdx(l.ts);byDay[d]=(byDay[d]||0)+l.sec;bySub[l.subj]=(bySub[l.subj]||0)+l.sec;total+=l.sec;if(l.sec>maxSes)maxSes=l.sec;if(l.sec>=1200)trees++;if(l.mood){moodS+=l.mood;moodN++}
    if(l.kind!=='manual'){const h=new Date(l.ts-l.sec*1000).getHours();parts[h>=5&&h<12?0:h>=12&&h<17?1:h>=17&&h<21?2:3]+=l.sec;if(h>=4&&h<7)early=true;if(h>=23||h<3)owl=true}}
  const today=dayIdx(Date.now());let streak=0,d=today;if(!byDay[d])d--;while(byDay[d]){streak++;d--}
  const keys=Object.keys(byDay).map(Number).sort((a,b)=>a-b);let best=0,rn=0,prev=null;
  for(const k of keys){rn=(prev!==null&&k===prev+1)?rn+1:1;if(rn>best)best=rn;prev=k}
  const goalDays=keys.filter(k=>byDay[k]>=S.goal*60).length;
  return{byDay,bySub,parts,total,maxSes,early,owl,trees,n:S.logs.length,today,todaySec:byDay[today]||0,streak,best,goalDays,subjN:Object.keys(bySub).length,mood:moodN?moodS/moodN:0}}

const PLB={focus:['آماده تمرکز','در حال تمرکز…','تمرکز متوقف شد'],short:['وقت یه نفس تازه','استراحت کن…','استراحت متوقف شد'],long:['استراحت بلند','در حال استراحت…','استراحت متوقف شد'],free:['کرنومتر آزاد','در حال مطالعه…','متوقف شد']};

const stageOf=p=>{let i=0;STAGES.forEach((s,k)=>{if(p>=s[0])i=k});return i};
let lastKey='',lastStage=-1,wiltUntil=0,rKey='';
function drawPlant(e,T){
  const el=$('#plant');if(Date.now()<wiltUntil)return;
  if(isBrk()){if(lastKey!=='cup'){el.innerHTML=CUP;lastKey='cup'}return}
  const p=T?Math.min(1,e/T):Math.min(1,(e%3600)/3600);
  const key=Math.round(p*300)+'|'+subj+'|'+run+'|'+(e>0)+'|'+phase+'|'+S.theme;
  if(key===lastKey)return;lastKey=key;
  el.innerHTML=plant(p,col(subj),{sway:run,paused:!run&&e>0});
  const st=stageOf(p);
  if(run&&lastStage>=0&&st>lastStage){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');if(S.set.vibrate&&navigator.vibrate)navigator.vibrate(35)}
  lastStage=st;
}
function clockText(e,T){const shown=T?Math.max(0,T-e):e;const m=Math.floor(shown/60),s=Math.floor(shown%60),h=Math.floor(m/60);return h?`${pad(h)}:${pad(m%60)}:${pad(s)}`:`${pad(m)}:${pad(s)}`}
function drawClock(){
  const e=elapsed(),T=tgt();
  if(run&&T&&e>=T){finish(true);return}
  const txt=clockText(e,T);
  $('#clock').textContent=txt;
  const p=T?Math.min(1,e/T):(e%3600)/3600;
  $('#arc-in').style.strokeDashoffset=IC*(1-p);
  const live=(phase==='focus'||phase==='free')?e:0;
  const gp=Math.min(1,(A.todaySec+live)/(S.goal*60));
  $('#arc-out').style.strokeDashoffset=OC*(1-gp);
  $('#goal-l').textContent=`هدف امروز ${fa(Math.round(gp*100))}٪`;
  const lab=(run&&(phase==='focus'||phase==='free'))?STAGES[stageOf(p)][1]:PLB[phase][run?1:(e>0?2:0)];
  $('#clock-l').textContent=lab;
  drawPlant(e,T);
  document.title=run?`${txt} • درسینو`:'درسینو';
  if(roomOn)drawRoom(e,T,p,txt,lab);

const AMBN={off:'خاموش',rain:'باران',wind:'باد',brown:'نویز'};
let amb=null,ambTO=null;
function ambStop(){clearTimeout(ambTO);if(amb){try{amb.src.stop();amb.g.disconnect()}catch(e){}amb=null}}
function ambStart(preview){
  ambStop();const k=S.set.amb;if(!k||k==='off')return;
  if(!preview&&!(run&&(phase==='focus'||phase==='free')))return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const len=ac.sampleRate*3,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    if(k==='brown'){let l=0;for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}}else for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
    const f=ac.createBiquadFilter(),g=ac.createGain();
    if(k==='rain'){f.type='highpass';f.frequency.value=1100;g.gain.value=.10}
    else if(k==='wind'){f.type='lowpass';f.frequency.value=380;g.gain.value=.28}
    else{f.type='lowpass';f.frequency.value=1000;g.gain.value=.4}
    src.connect(f);f.connect(g);g.connect(ac.destination);src.start();amb={src,g};
    if(preview&&!run)ambTO=setTimeout(ambStop,2500);
  }catch(e){}
}

/* ---------- test math ---------- */
const testPct=t=>t.count?Math.max(0,(3*t.correct-t.wrong)/(3*t.count)*100):0;   // درصد با نمره منفی
const testAcc=t=>t.count?t.correct/t.count*100:0;
function slope(a){const n=a.length;if(n<2)return 0;const mx=(n-1)/2,my=a.reduce((x,y)=>x+y,0)/n;let nu=0,de=0;a.forEach((y,i)=>{nu+=(i-mx)*(y-my);de+=(i-mx)**2});return de?nu/de:0}
const topicsOf=ex=>String(ex.topics||'').split(/[\n,،;؛]+/).map(x=>x.trim()).filter(Boolean);
function examReady(ex){const t=topicsOf(ex);if(!t.length)return +ex.ready||0;const d=(ex.td||[]).filter(i=>i<t.length).length;return Math.round(d/t.length*100)}

/* ---------- coach: the built-in "AI" (statistical, offline) ---------- */
function coachModel(){
  const now=Date.now(),wk=weekStart().getTime();
  const subs=S.subjects.map(subj=>{
    const tests=S.tests.filter(t=>t.subj===subj).sort((a,b)=>a.ts-b.ts);
    const last5=tests.slice(-5),pcts=last5.map(testPct);
    let ws=0,wt=0;pcts.forEach((p,i)=>{ws+=p*(i+1);wt+=i+1});
    const pct=pcts.length?ws/wt:null,tr=slope(pcts);
    const qs=last5.reduce((n,t)=>n+t.count,0);
    const blank=qs?last5.reduce((n,t)=>n+t.blank,0)/qs*100:null,wrong=qs?last5.reduce((n,t)=>n+t.wrong,0)/qs*100:null;
    const secQ=qs?last5.reduce((n,t)=>n+t.minutes,0)*60/qs:null;
    const logs=S.logs.filter(l=>l.subj===subj),secWeek=logs.filter(l=>l.ts>=wk).reduce((n,l)=>n+l.sec,0);
    const lastTs=logs.reduce((m,l)=>Math.max(m,l.ts),0),since=lastTs?Math.floor((now-lastTs)/864e5):null;
    const cards=S.flashcards.filter(c=>c.subj===subj),due=cards.filter(c=>c.due<=now).length;
    const ex=S.exams.filter(e=>e.subj===subj&&daysUntil(e.date)>=0).sort((a,b)=>a.date.localeCompare(b.date))[0]||null;
    const exDays=ex?daysUntil(ex.date):null,exReady=ex?examReady(ex):null;
    const weak=pct===null?52:100-pct,trendPen=tr<-4?14:tr<-1?7:0,neglect=since===null?26:Math.min(30,since*4);
    const exam=ex?(exDays<=3?48:exDays<=7?38:exDays<=14?24:exDays<=30?12:0)*(1-Math.min(.8,exReady/140)):0;
    const priority=weak*.5+trendPen+neglect*.7+exam+Math.min(14,due*1.4)+(secWeek<2700?10:secWeek<5400?5:0);
    const reasons=[];
    reasons.push(pct!==null?`درصد آزمون‌ها ${fa(Math.round(pct))}٪`:'هنوز آزمونی ثبت نشده');
    if(tr<-1&&pcts.length>=3)reasons.push('روند آزمون‌ها نزولی است');
    if(tr>2&&pcts.length>=3)reasons.push('روند آزمون‌ها صعودی است');
    if(since===null)reasons.push('هنوز بهش سر نزدی');else if(since>=3)reasons.push(`${fa(since)} روزه که نخوندی`);
    if(ex)reasons.push(`امتحان ${fa(exDays)} روز دیگه`);
    if(due>=3)reasons.push(`${fa(due)} کارت برای مرور`);
    if(secWeek<2700)reasons.push('این هفته کم خوندی');
    return{subj,pct,tr,nTests:tests.length,blank,wrong,secQ,secWeek,since,cards:cards.length,due,ex,exDays,exReady,priority,
      level:pct===null?'نامشخص':pct>=70?'قوی':pct>=45?'متوسط':'ضعیف',reasons,pcts:tests.map(t=>({v:testPct(t),ts:t.ts})),color:col(subj)}
  }).sort((a,b)=>b.priority-a.priority);
  return{subs,by:Object.fromEntries(subs.map(s=>[s.subj,s]))};
}
function blockType(s){
  if(s.ex&&s.exDays<=7)return['مرور و تست زمان‌دار','exam'];
  if(s.pct!==null&&s.pct<45)return['رفع اشکال و یادگیری مجدد','fix'];
  if(s.pct===null)return['شروع و تعیین سطح','start'];
  if(s.due>=6)return['مرور فلش‌کارت و تثبیت','cards'];
  if(s.since!==null&&s.since>=4)return['بازگشت به درس','back'];

}

/* ---------- weekly planner (AI) ---------- */
const PERIODS={morning:['صبح',8*60],afternoon:['بعدازظهر',15*60],evening:['شب',19.5*60],flex:['منعطف',9*60]};
const defaultCfg=()=>({daily:[120,120,120,120,120,120,60],session:45,period:'afternoon',off:-1,strategy:'balanced',maxPer:2,cards:true});
const curWeek=()=>S.weekly[weekKey()]||null;
const todayBlocks=()=>{const w=curWeek();return w&&w.days&&w.days[todayIdx()]?w.days[todayIdx()]:[]};
const hhmm=m=>`${pad2(Math.floor(m/60)%24)}:${pad2(Math.round(m%60))}`;
function buildWeek(cfgIn){
  const m=coachModel(),key=weekKey(),old=S.weekly[key]||{},tIdx=todayIdx();
  const cfg=Object.assign(defaultCfg(),old.config||{},cfgIn||{});
  const w={days:{},config:cfg,selected:old.selected!=null?old.selected:tIdx,built:Date.now(),plan:[],tips:[]};
  for(let d=0;d<7;d++){const prev=(old.days&&old.days[d])||[];w.days[d]=d<tIdx?prev:prev.filter(b=>b.done||b.manual)}
  const subs=m.subs;
  if(!subs.length){S.weekly[key]=w;save();return w}
  const avg=subs.reduce((a,b)=>a+b.priority,0)/subs.length;
  const wts=subs.map(s=>{let p=Math.max(8,s.priority);if(cfg.strategy==='weak')p=Math.pow(p,1.35);else if(cfg.strategy==='exam')p*=(s.ex&&s.exDays<=21?2.6:.8);else p=p*.6+avg*.4;return p});
  const wt=wts.reduce((a,b)=>a+b,0);
  const free=[];let B=0;
  for(let d=tIdx;d<7;d++){let b=d===cfg.off?0:Math.max(0,+cfg.daily[d]||0);
    if(S.exams.some(e=>daysUntil(e.date)===d-tIdx))b=Math.round(b*.4);
    const used=w.days[d].reduce((n,x)=>n+(+x.minutes||0),0);b=Math.max(0,b-used);free.push({d,b});B+=b}
  const target=subs.map((s,i)=>B*wts[i]/wt),placed=subs.map(()=>0),sess=Math.max(20,+cfg.session||45);
  const totalDue=S.flashcards.filter(c=>c.due<=Date.now()+864e5).length;
  free.forEach(({d,b})=>{
    let budget=b;const dd=d-tIdx;if(budget<15)return;
    const cardSlot=cfg.cards&&totalDue>=6&&budget>=60;if(cardSlot)budget-=15;
    const prevSubs=new Set((w.days[d-1]||[]).map(x=>x.subj)),perDay={},list=[];
    while(budget>=15){
      let bi=-1,bs=-1e9;
      subs.forEach((s,i)=>{
        let sc=target[i]-placed[i];
        const left=s.ex?s.exDays-dd:null;
        if((perDay[s.subj]||0)>=cfg.maxPer)sc-=1e6;
        if(prevSubs.has(s.subj)&&!(s.ex&&s.exDays<=7))sc-=12;
        if(list.length&&list[list.length-1].subj===s.subj)sc-=40;
        if(left!==null){if(left===1)sc+=35;if(left<=0)sc-=1e6}
        if(!list.length)sc+=s.priority*.25;
        if(sc>bs){bs=sc;bi=i}
      });
      if(bi<0||bs<-5e5)break;
      const s=subs[bi],mins=Math.min(sess,budget);if(mins<15)break;
      let [title,kind]=blockType(s);const left=s.ex?s.exDays-dd:null;
      if(left===1){title='مرور نهایی قبل از امتحان';kind='exam'}
      else if(list.length&&list.length===Math.floor(b/sess)-1&&kind==='practice')title='مرور سبک و جمع‌بندی';
      list.push({id:Date.now()+Math.random(),subj:s.subj,title,kind,minutes:mins,why:s.reasons.slice(0,2).join(' • '),done:false,spent:0});
      budget-=mins;perDay[s.subj]=(perDay[s.subj]||0)+1;placed[bi]+=mins;
    }
    if(cardSlot){const top=subs.slice().sort((a,b)=>b.due-a.due)[0];list.push({id:Date.now()+Math.random(),subj:top.subj,title:'مرور فلش‌کارت‌ها',kind:'cards',minutes:15,why:`${fa(totalDue)} کارت منتظر مرور است`,done:false,spent:0})}
    // times
    const per=PERIODS[cfg.period]||PERIODS.flex;let span=list.reduce((n,x)=>n+x.minutes+10,0),start=per[1];
    if(start+span>23*60)start=Math.max(6.5*60,23*60-span);
    let cur=start;list.forEach(x=>{x.at=hhmm(cur);x.period=cfg.period;cur+=x.minutes+10});
    w.days[d]=w.days[d].concat(list);
  });
  // explanation
  w.plan=subs.map((s,i)=>({subj:s.subj,min:Math.round(placed[i]),color:s.color,why:s.reasons.slice(0,3).join(' • '),level:s.level})).filter(x=>x.min>0).sort((a,b)=>b.min-a.min);
  w.budget=B;w.placedTotal=Math.round(placed.reduce((a,b)=>a+b,0));
  if(!B)w.tips.push('زمان آزاد این هفته صفره؛ از «تنظیم زمان‌ها» بودجه روزها رو مشخص کن.');
  const exs=subs.filter(s=>s.ex&&s.exDays<=14);if(exs.length)w.tips.push(`برای ${exs.map(s=>s.ex.title).join(' و ')} روزهای نزدیک امتحان رو سبک‌تر و مرورمحور چیدم.`);
  if(cfg.strategy==='weak')w.tips.push('سهم درس‌های ضعیف‌تر رو بیشتر کردم.');
  if(cfg.off>=0)w.tips.push(`${WD[cfg.off]} رو روز استراحت گذاشتم.`);
  w.tips.push('درس‌های پشت سر هم تکراری نمی‌شن تا مغزت خسته نشه و تثبیت بهتر بشه.');
  S.weekly[key]=w;save();return w;
}

function missionList(kind){
  const M=metrics(),tk=todayKey(),wk=weekKey();
  const mk=(row,pk)=>{const max=row[4]==='goal'?S.goal:row[4],cur=Math.max(0,+row[3](M)||0),claimed=((S.missions[pk]||{}).claimed||[]).includes(row[0]);
    return{id:row[0],pk,t:row[1],d:row[2],icon:row[6],cur:Math.min(cur,max),max,done:cur>=max,claimed,xp:row[5]}};
  if(kind==='d')return seededPick(MD,5,'d'+tk).map(r=>mk(r,'d'+tk));
  if(kind==='w')return seededPick(MW,8,'w'+wk).map(r=>mk(r,'w'+wk));
  return ML.map(c=>{const cl=((S.missions.L||{}).claimed||[]);const tiers=c[4];let i=tiers.findIndex(t=>!cl.includes(c[0]+'_'+t[0]));
    const all=i<0,t=tiers[all?tiers.length-1:i],cur=Math.max(0,+c[3](M)||0);
    return{id:c[0]+'_'+t[0],pk:'L',cat:c[1],t:`${c[1]}: ${t[1]}`,d:`به ${fa(t[0])} ${c[5]} برس`,icon:c[2],cur:Math.min(cur,t[0]),max:t[0],done:cur>=t[0],claimed:all,xp:t[2],rare:t[3]||null,tier:`${tiers.filter(x=>cl.includes(c[0]+'_'+x[0])).length}/${tiers.length}`}});
}
function claimMission(pk,id){
  const m=[].concat(missionList('d'),missionList('w'),missionList('L')).find(x=>x.id===id&&x.pk===pk);if(!m||!m.done||m.claimed)return null;
  S.missions[pk]=S.missions[pk]||{claimed:[]};S.missions[pk].claimed.push(id);S.xp=(S.xp||0)+m.xp;
  let rare=null;if(m.rare){rare={id:Date.now(),ts:Date.now(),kind:m.rare,name:RARE[m.rare][0]};S.rare.push(rare)}
  save();return{m,rare};
}
function missionNotices(){
  const out=[];[].concat(missionList('d'),missionList('w'),missionList('L')).forEach(m=>{const k=m.pk+':'+m.id;if(m.done&&!m.claimed&&!S.mseen[k]){S.mseen[k]=1;out.push(`${ic('gift',18)} ماموریت کامل شد: ${m.t}`)}});

}

/* exams */
function examAdvice(ex){
  const d=daysUntil(ex.date),t=topicsOf(ex),rem=t.length?t.length-(ex.td||[]).filter(i=>i<t.length).length:null,ready=examReady(ex);
  if(d<0)return 'این امتحان گذشته.';
  if(ready>=100)return 'همه‌ی مباحث رو پوشش دادی. حالا فقط مرور و تست زمان‌دار.';
  const need=rem!==null?rem*45:Math.round((100-ready)*3),per=d>0?Math.ceil(need/d):need;
  const over=per>S.goal?` این از هدف روزانه‌ات (${fmtDur(S.goal*60)}) بیشتره؛ یا زمان بیشتری بذار یا مباحث کم‌اهمیت رو کنار بذار.`:'';
  return `${rem!==null?`${fa(rem)} مبحث باقی مونده. `:''}برای رسیدن به آمادگی کامل حدود ${fmtDur(need*60)} مطالعه لازمه؛ یعنی روزی ${fmtDur(per*60)}.${over}`;
}

  return a.map(x=>{const d=daysUntil(x.date),t=topicsOf(x),ready=examReady(x);

function lineChart(series){
  const w=320,h=176,pl=28,pr=10,pt=10,pb=22,all=series.flatMap(s=>s.pts);
  if(!all.length)return '';
  const t0=Math.min(...all.map(p=>p.ts)),t1=Math.max(...all.map(p=>p.ts));
  const X=ts=>pl+(t1===t0?(w-pl-pr)/2:(ts-t0)/(t1-t0)*(w-pl-pr)),Y=v=>pt+(1-Math.max(0,Math.min(100,v))/100)*(h-pt-pb);
  let g='';[0,25,50,75,100].forEach(v=>{g+=`<line class="gl" x1="${pl}" x2="${w-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axt" x="${pl-5}" y="${Y(v)+3}" text-anchor="end">${v}</text>`});
  g+=`<line class="tg" x1="${pl}" x2="${w-pr}" y1="${Y(70)}" y2="${Y(70)}"/>`;
  const d=x=>new Intl.DateTimeFormat('fa-IR',{month:'numeric',day:'numeric'}).format(new Date(x));
  g+=`<text class="axt" x="${pl}" y="${h-6}" text-anchor="start">${d(t0)}</text>`+(t1!==t0?`<text class="axt" x="${w-pr}" y="${h-6}" text-anchor="end">${d(t1)}</text>`:'');
  series.forEach(s=>{const pts=s.pts.map(p=>[X(p.ts),Y(p.v)]);if(pts.length>1)g+=`<polyline class="ln" style="stroke:${s.color}" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;pts.forEach(p=>g+=`<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="3.6" fill="${s.color}"/>`)});
  return `<svg class="lc" viewBox="0 0 ${w} ${h}" role="img" aria-label="روند درصد آزمون‌ها">${g}</svg>`;
}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function errAdvice(s){
  const out=[];
  if(s.pct===null)return 'هنوز آزمونی از این درس ثبت نشده.';
  if(s.wrong!==null&&s.wrong>(s.blank||0)*1.5&&s.wrong>15)out.push('غلط‌هات از نزده‌هات بیشتره و نمره منفی نمره‌ات رو می‌خوره؛ روی تست‌های مطمئن بزن و حدسی‌ها رو بذار آخر.');
  else if(s.blank>25)out.push('تعداد نزده‌هات زیاده؛ احتمالاً مفاهیم پایه کامل نیست. اول رفع اشکال و بعد تست زمان‌دار.');
  else if(s.pct>=70)out.push('عملکرد خوبیه؛ برای حفظ سطح، تست‌های سخت‌تر و مرور فاصله‌دار کافیه.');
  else out.push('سطح متوسطه؛ تحلیل غلط‌ها بعد از هر آزمون بیشترین بهبود رو می‌ده.');
  if(s.secQ!==null){if(s.secQ>110)out.push(`سرعتت کمه (${fa(Math.round(s.secQ))} ثانیه برای هر تست)؛ تست‌های زمان‌دار کوتاه تمرین کن.`);else if(s.secQ<40&&s.pct<60)out.push('خیلی سریع می‌زنی و دقتت پایینه؛ یه کم آروم‌تر.')}
  if(s.tr<-3&&s.pcts.length>=3)out.push('روند آزمون‌های اخیر نزولیه؛ سراغ مباحث جدید نرو و اول مرور کن.');
  return out.join(' ');
}
function testInsights(){
  const T=S.tests.slice().sort((a,b)=>a.ts-b.ts),out=[];if(!T.length)return out;
  const m=coachModel(),withT=m.subs.filter(s=>s.pct!==null),p=T.map(testPct);
  if(T.length>=4){const k=Math.min(3,Math.floor(T.length/2)),dl=avg(p.slice(-k))-avg(p.slice(-2*k,-k));
    out.push(dl>=4?{i:'up',t:`روند کلی صعودیه: میانگین ${fa(k)} آزمون اخیرت ${fa(Math.round(dl))} درصد از قبل بهتره.`}:dl<=-4?{i:'down',t:`روند کلی نزولی شده: ${fa(k)} آزمون اخیر ${fa(Math.round(-dl))} درصد پایین‌تر از قبلیه.`}:{i:'swap',t:'روند کلی تقریباً ثابته؛ برای جهش، روی ضعیف‌ترین درس تمرکز کن.'})}
  if(withT.length){const w=withT.slice().sort((a,b)=>a.pct-b.pct)[0],s=withT.slice().sort((a,b)=>b.pct-a.pct)[0];

  return out;
}

function species(sec){if(sec<900)return{n:'جوانه',p:.14};if(sec<1800)return{n:'نهال',p:.38};if(sec<2700)return{n:'درخت',p:.75};if(sec<4500)return{n:'درخت شکوفه',p:1,bloom:true};return{n:'درخت پربار',p:1,fruit:true}}
const flowerSvg=(c)=>{const P=[0,60,120,180,240,300].map(a=>`<ellipse cx="50" cy="${44-9}" rx="6.5" ry="10" transform="rotate(${a} 50 44)" fill="${c}" opacity=".92"/>`).join('');return `<svg viewBox="0 0 100 100" class="tree"><ellipse cx="50" cy="92" rx="26" ry="4.500" fill="rgba(128,128,128,.14)"/><path d="M26 91Q50 80 74 91Z" fill="#5a4636"/><path d="M50 86V46" stroke="#7fae78" stroke-width="3" stroke-linecap="round"/><path d="M50 72c-10-2-14-8-14-12 8 0 14 4 14 12zM50 66c8-2 12-7 12-11-7 0-12 4-12 11z" fill="#7fae78"/>${P}<circle cx="50" cy="44" r="6" fill="#e9d9a0"/></svg>`};
function gardenList(){
  const it=[];
  S.logs.filter(l=>l.sec>=60).forEach(l=>it.push({t:'tree',ts:l.ts,sec:l.sec,subj:l.subj,mood:l.mood,note:l.note,task:l.task,kind:l.kind,sp:species(l.sec)}));
  S.flowers.forEach(f=>it.push({t:'flower',ts:f.ts,count:f.count,acc:f.acc,subj:f.subj}));
  S.rare.forEach(r=>it.push({t:'rare',ts:r.ts,kind:r.kind,name:r.name}));
  S.wilted.forEach(w=>it.push({t:'wilt',ts:w.ts,subj:w.subj,min:w.min}));

}
function itemSvg(it,sway){

}

/* --- addLog (rewrites v4 version: plan credit, missions, XP) --- */
function addLog(l){
  const prevTotal=xpTotal(),prevToday=A.todaySec;
  const rec=Object.assign({id:Date.now()+Math.random()},l);
  S.logs.push(rec);S.logs.sort((a,b)=>b.ts-a.ts);
  if(dayIdx(rec.ts)===dayIdx(Date.now()))autoCredit(rec);
  A=agg();
  const msgs=[],nl=lvlOf(xpTotal()),pl=lvlOf(prevTotal);
  if(nl>pl){msgs.push(`${ic('bolt',18)} سطح ${fa(nl)}: ${LV[Math.min(nl-1,LV.length-1)]}`);confetti()}
  if(prevToday<S.goal*60&&A.todaySec>=S.goal*60){msgs.push(`${ic('target',18)} هدف امروز کامل شد`);confetti()}
  ACH.forEach(x=>{if(!S.ach[x.id]&&x.f(A)){S.ach[x.id]=Date.now();msgs.push(`${ic(x.i,18)} دستاورد جدید: ${x.t}`)}});
  save();missionNotices().forEach(m=>msgs.push(m));
  msgs.slice(0,4).forEach(toastQ);if(!msgs.length)toast(`${ic('check',18)} ثبت شد`);
  renderAll();schedDaily();
}

/* reminders (native schedule + web fallback) */
async function schedDaily(){
  if(!LN)return;try{await LN.cancel({notifications:[{id:2001}]})}catch(e){}
  const r=S.reminder;if(!r.on||!(await notifPerm()))return;const[h,m]=String(r.time||'19:00').split(':').map(Number);
  const due=dueCards().length,body=due>=5?`${fa(due)} کارت برای مرور منتظرته.`:A&&A.streak>0?`${fa(A.streak)} روز پیاپی شدی. امروز هم ادامه بده.`:'وقت مطالعه‌ست. یه جلسه کوتاه شروع کن.';
  try{await LN.schedule({notifications:[{id:2001,title:'درسینو',body,channelId:'reminder',schedule:{on:{hour:h,minute:m},allowWhileIdle:true}}]})}catch(e){}}
function webReminder(){
  if(NATIVE||!S.reminder.on||!('Notification' in window)||Notification.permission!=='granted')return;
  const d=new Date(),now=`${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  if(now===S.reminder.time&&S.reminder.last!==todayKey()){S.reminder.last=todayKey();save();try{new Notification('درسینو',{body:'وقت مطالعه‌ست. یه جلسه کوتاه شروع کن.'})}catch(e){}}}
setInterval(webReminder,30000);

/* strict mode: leaving the app withers the tree */
let leftAt=0;
function witherNow(){const e=elapsed();stopRun();acc=0;customMin=null;S.wilted.push({id:Date.now(),ts:Date.now(),subj,min:Math.round(e/60)});save();pt();$('#plant').innerHTML=plant(.55,'#8a7348',{wilt:true});lastKey='wilt';wiltUntil=Date.now()+2500;drawClock();setMain();renderAll();toast(`${ic('leaf',18)} از برنامه رفتی بیرون و نهال پژمرد`)}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(run&&phase==='focus'&&S.set.strict)leftAt=Date.now();return}
  if(leftAt){const away=Date.now()-leftAt;leftAt=0;if(run&&phase==='focus'&&S.set.strict&&away>20000){witherNow();return}}
  drawClock();if(run)lock();
});

/* ====================== weekly report (image + PDF) ====================== */
async function makeReport(){
  const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const cs=getComputedStyle(document.documentElement),V=n=>cs.getPropertyValue(n).trim();
  const bg=V('--bg'),s1=V('--s1'),s2=V('--s2'),line=V('--line'),text=V('--text'),mute=V('--mute'),acc=V('--a'),ink=V('--ink');
  const f=FONTS.find(x=>x.id===S.font)||FONTS[0],fam=f.id==='system-ui'?'system-ui,Tahoma,sans-serif':`"${f.id}",Tahoma,sans-serif`;
  try{await Promise.all([document.fonts.load(`400 30px ${fam}`),document.fonts.load(`800 30px ${fam}`)])}catch(e){}
  g.direction='rtl';
  const T=(s,x,y,sz,wt,c,al)=>{g.font=`${wt} ${sz}px ${fam}`;g.fillStyle=c;g.textAlign=al||'right';g.fillText(s,x,y)};
  const RR=(x,y,w,h,r,fill,st)=>{g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h);if(fill){g.fillStyle=fill;g.fill()}if(st){g.strokeStyle=st;g.lineWidth=2;g.stroke()}};
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  const M=metrics(),ws=weekStart(),we=new Date(ws);we.setDate(we.getDate()+6);
  const wk=weekStart().getTime(),logs=S.logs.filter(l=>l.ts>=wk),totalMin=Math.round(logs.reduce((n,l)=>n+l.sec,0)/60);
  const prevStart=wk-7*864e5,prevMin=Math.round(S.logs.filter(l=>l.ts>=prevStart&&l.ts<wk).reduce((n,l)=>n+l.sec,0)/60);
  // header
  T('گزارش هفته',W-70,130,70,800,text);T(`${faDate(ws)} تا ${faDate(we)}${S.name?' • '+S.name:''}`,W-70,190,32,400,mute);
  RR(70,86,96,96,28,s2);g.fillStyle=acc;g.beginPath();g.arc(118,124,20,0,7);g.fill();g.fillRect(114,134,8,26);
  // hero
  RR(70,240,W-140,260,36,s1,line);
  T('مجموع مطالعه',W-110,310,30,400,mute);
  T(`${fa(Math.floor(totalMin/60))} ساعت و ${fa(totalMin%60)} دقیقه`,W-110,400,68,800,text);
  const dl=prevMin?Math.round((totalMin-prevMin)/prevMin*100):null;
  T(dl===null?'اولین هفته‌ی ثبت‌شده':`${fa(Math.abs(dl))}٪ ${dl>=0?'بیشتر':'کمتر'} از هفته قبل`,W-110,460,30,700,dl!==null&&dl>=0?acc:mute);
  T(`${fa(M.w.goalDays)} روز با هدف`,150,460,28,400,mute,'left');
  // bars
  const by={};S.logs.forEach(l=>{const d=dayIdx(l.ts);by[d]=(by[d]||0)+l.sec});const base=dayIdx(ws.getTime()),vals=Array.from({length:7},(_,i)=>(by[base+i]||0)/60),mx=Math.max(S.goal,...vals,30);
  RR(70,530,W-140,330,36,s1,line);T('مطالعه‌ی روزانه',W-110,590,30,700,text);
  const bw=88,gap=(W-220-bw*7)/6;
  vals.forEach((v,i)=>{const x=W-110-bw-(bw+gap)*i,h=Math.max(6,v/mx*170),y=800-h;RR(x,y,bw,h,14,v>=S.goal?acc:s2);if(v>0)RR(x,y,bw,h,14,v>=S.goal?acc:`${acc}66`);T(WD[i].slice(0,3),x+bw/2,838,22,400,mute,'center');if(v>0)T(fa(Math.round(v)),x+bw/2,y-10,22,700,text,'center')});
  g.strokeStyle=mute;g.setLineDash([8,8]);g.globalAlpha=.6;g.beginPath();g.moveTo(110,800-S.goal/mx*170);g.lineTo(W-110,800-S.goal/mx*170);g.stroke();g.setLineDash([]);g.globalAlpha=1;
  // tiles
  const tile=(i,label,val)=>{const w=(W-140-40)/3,x=W-70-w-(w+20)*i;RR(x,890,w,150,30,s1,line);T(label,x+w-28,945,26,400,mute);T(val,x+w-28,1005,52,800,text)};
  tile(0,'روز پیاپی',fa(A.streak));tile(1,'جلسه',fa(logs.length));tile(2,'مرور کارت',fa(M.w.reviews));
  // subjects
  RR(70,1070,W-140,170,36,s1,line);
  const bs={};logs.forEach(l=>bs[l.subj]=(bs[l.subj]||0)+l.sec);const top=Object.entries(bs).sort((a,b)=>b[1]-a[1]).slice(0,3),tm=top[0]?top[0][1]:1;
  T('درس‌های پرتکرار',W-110,1124,28,700,text);
  if(!top.length)T('این هفته هنوز جلسه‌ای ثبت نشده',W-110,1190,28,400,mute);
  top.forEach(([s,v],i)=>{const y=1155+i*30;T(s,W-110,y+10,22,400,text);const bwid=380*v/tm;RR(W-420-bwid,y-8,bwid,16,8,col(s));T(fmtDur(v),130,y+10,22,400,mute,'left')});
  // footer
  const c=coachToday();T(c.primary?`پیشنهاد مربی: ${c.primary.subj} • ${c.type}`:'با درسینو هر روز یه قدم جلوتر',W-70,1290,30,700,acc);T('درسینو',110,1290,30,800,mute,'left');
  return cv;
}
function dlBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function jpegPdf(dataUrl,iw,ih){
  const bin=atob(dataUrl.split(',')[1]),img=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)img[i]=bin.charCodeAt(i);
  const PW=595,PH=842,sc=Math.min(PW/iw,PH/ih),w=iw*sc,h=ih*sc,x=(PW-w)/2,y=(PH-h)/2,enc=s=>new TextEncoder().encode(s),parts=[],offs=[];let off=0;
  const push=u=>{parts.push(u);off+=u.length};
  push(enc('%PDF-1.4\n'));
  const obj=(n,b)=>{offs[n]=off;push(enc(`${n} 0 obj\n`));push(enc(b));push(enc('\nendobj\n'))};
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  offs[4]=off;push(enc(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`));push(img);push(enc('\nendstream\nendobj\n'));
  const cont=`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q`;obj(5,`<< /Length ${cont.length} >>\nstream\n${cont}\nendstream`);
  const xo=off;let xr='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<=5;i++)xr+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(enc(xr+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF`));return new Blob(parts,{type:'application/pdf'});
}
let rep=null;
ACT['report']=async()=>{
  sheet(`<h2>گزارش هفته</h2><p class="s">در حال ساخت گزارش…</p>`);
  try{const cv=await makeReport(),url=cv.toDataURL('image/jpeg',.92);rep={cv,url};

  catch(e){console.error(e);closeSheet();toast('ساخت گزارش ممکن نشد')}};
ACT['rep-img']=async()=>{const b=await new Promise(r=>rep.cv.toBlob(r,'image/jpeg',.92));dlBlob(b,'darsino-week.jpg');toast('تصویر ذخیره شد؛ اگه دانلود نشد روی عکس نگه دار')};
ACT['rep-pdf']=()=>{dlBlob(jpegPdf(rep.url,rep.cv.width,rep.cv.height),'darsino-week.pdf');toast('PDF ساخته شد')};
ACT['rep-share']=async()=>{const b=await new Promise(r=>rep.cv.toBlob(r,'image/jpeg',.92)),file=new File([b],'darsino-week.jpg',{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'گزارش هفته درسینو'});return}catch(e){if(e&&e.name==='AbortError')return}}

const TOUR=[['timer','تایمر و درخت','هر جلسه‌ی تمرکز یه درخت می‌کاره. می‌تونی وارد «اتاق تمرکز» بشی تا هیچ چیز حواست رو پرت نکنه.'],['calendar','برنامه‌ی هوشمند','مربی بر اساس آزمون‌ها، امتحان‌ها و زمان آزادت هفته رو می‌چینه و دلیل هر انتخاب رو هم می‌گه.'],['cards','یادگیری','فلش‌کارت‌ها با تکرار فاصله‌دار سر موقع نشونت داده می‌شن و تحلیل آزمون‌ها نقطه‌ضعف‌هات رو پیدا می‌کنه.'],['chart','پیشرفت','آمار، باغ، ماموریت‌های روزانه و هفتگی و دستاوردها همه یه‌جاست.']];
let tourI=0;
function tour(i){tourI=i;const t=TOUR[i],last=i===TOUR.length-1;
  sheet(`<div class="tour-ic">${ic(t[0],34)}</div><h2>${t[1]}</h2><p class="s" style="min-height:66px">${t[2]}</p><div class="tour-dots">${TOUR.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
  <div class="row">${i?'<button class="btn ghost" data-act="tour-prev">قبلی</button>':'<button class="btn ghost" data-act="tour-end">رد کردن</button>'}<button class="btn" data-act="${last?'tour-end':'tour-next'}">${last?'شروع':'بعدی'}</button></div>`,false)}
ACT['tour']=()=>tour(0);ACT['tour-next']=()=>tour(tourI+1);ACT['tour-prev']=()=>tour(tourI-1);ACT['tour-end']=()=>{S.tour=true;save();closeSheet()};

  sheet(`<h2>به درسینو خوش اومدی</h2><p class="s">دو تا سؤال کوتاه تا برات شخصی‌سازی کنیم</p><label class="lb">اسمت چیه؟</label><input class="tx" id="ob-n" placeholder="اسم">
  <label class="lb">هدف مطالعه‌ی روزانه</label><div class="presets" id="ob-g" style="justify-content:flex-start">${[60,120,180,240].map(m=>`<button class="chip ${m===120?'on':''}" data-act="ob-goal" data-m="${m}">${fmtDur(m*60)}</button>`).join('')}</div>
